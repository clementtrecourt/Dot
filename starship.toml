# ~/.config/starship.toml

# Utiliser la palette générée tout en bas

palette = "noctalia"

# Ajouter une ligne vide entre chaque commande
add_newline = true

# ---------------------------------------------------------
# 1. FORMATS DE PROMPT (Gauche et Droite)
# ---------------------------------------------------------
# Prompt à gauche (Dossier, Git, Langages...)
format = """
$directory$git_branch$git_status$c$rust$golang$nodejs$python
$character"""

# Prompt à droite (Heure uniquement)
right_format = """$time"""

# ---------------------------------------------------------
# 2. CONFIGURATION DES MODULES
# ---------------------------------------------------------

# Le symbole de commande
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

# Le dossier actuel (Retour au Cyan d'avant, plus vif)
[directory]
style = "bold cyan"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = true

# Git - La branche (Retour au Magenta d'avant)
[git_branch]
symbol = " "
style = "bold magenta"
format = "on [$symbol$branch]($style) "

# Git - Le statut (modifié, ajouté, etc.)
[git_status]
style = "bold peach"
format = '([\[$all_status$ahead_behind\]]($style) )'

# Configuration de l'heure (Affichée à droite)
[time]
disabled = false
time_format = "%R" # Format 24h (HH:MM)
style = "bold overlay2" # Utilise un gris doux de ta palette pour ne pas gêner
format = "[$time]($style)"

# Temps d'exécution
[cmd_duration]
min_time = 2000
format = "⏱ [$duration](bold yellow)"
style = "bold yellow"

# Langages de programmation
[python]
symbol = "󰌠 "
style = "sky"
[nodejs]
symbol = "󰎙 "
style = "green"
[rust]
symbol = " "
style = "red"
[golang]
symbol = " "
style = "cyan"

# >>> NOCTALIA STARSHIP PALETTE >>>
