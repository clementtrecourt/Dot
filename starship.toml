
add_newline = false

format = """$directory$git_branch$git_status$rust$nodejs$python$golang $character """

right_format = "$time"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
style = "dimmed white"

[directory]
home_symbol = "~"
truncation_length = 3
truncation_symbol = "…/"
read_only = " ◈"
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style)"
repo_root_style = "bold blue"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"

[git_branch]
format = " [$branch]($style)"
symbol = ""
style = "bright-blue"
truncation_symbol = "⋯"
truncation_length = 15
ignore_branches = []
only_attached = true

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "bright-blue"
conflicted = " !"
ahead = " ▴${count}"
behind = " ▿${count}"
diverged = " ◇▴${ahead_count}▿${behind_count}"
untracked = ""
stashed = " ="
modified = " *"
staged = " +${count}"
renamed = " »"
deleted = " ✕"

[rust]
format = " [rs $version]($style)"
version_format = "${raw}"
style = "dimmed red"

[nodejs]
format = " [node $version]($style)"
version_format = "${raw}"
style = "dimmed green"
detect_files = ["package.json", "package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[python]
format = " [py $version]($style)"
version_format = "${raw}"
style = "dimmed yellow"

[golang]
format = " [go $version]($style)"
version_format = "${raw}"
style = "dimmed cyan"

[character]
format = "$symbol"

