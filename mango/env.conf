# ~/.config/mango/env.conf
# Environment variables for non-mango items

# GTK/QT theming - force dark mode
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT5_QPA_PLATFORMTHEME,qt5ct

# Cursor and icon themes
env=XCURSOR_THEME,macos-tahoe-cursor
env=XCURSOR_SIZE,24

# Include flatpak exports for icons and desktop files
env=XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:$HOME/.local/share:/usr/local/share:/usr/share

# Session type
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# ─── Nouvelles variables pour les apps Wayland (Natif) ───
env=MOZ_ENABLE_WAYLAND,1               # Firefox natif Wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto  # Apps Electron (Discord, Obsidian, etc.) natif Wayland
exec-once = export XDG_DATA_DIRS="$HOME/.local/share:/run/current-system/sw/share:/etc/profiles/per-user/$USER/share"
env=XDG_DATA_DIRS,$HOME/.local/share:/run/current-system/sw/share:/etc/profiles/per-user/$USER/share

