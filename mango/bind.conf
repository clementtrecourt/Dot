# ~/.config/mango/bind.conf

# ============================================
# System
# ============================================
bind=SUPER,r,reload_config
bind=SUPER,q,killclient,

# ============================================
# Applications (matching niri)
# ============================================
bind=SUPER,T,spawn,kitty
bind=SUPER+CTRL,Return,spawn,kitty -T floating-kitty

# App launchers
bind=SUPER,Z,spawn,zed
bind=SUPER,E,spawn,kitty -e nvim
bind=SUPER,F,spawn,nemo


bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ============================================
# Window Movement (SUPER + Shift + Arrows)
# ============================================
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# Mouse Window Movement
axisbind=SUPER+ALT,UP,focusdir,left
axisbind=SUPER+ALT,DOWN,focusdir,right

# ============================================
# Workspace Navigation (Tags as Workspaces)
# ============================================
# Switch workspaces up/down
bind=SUPER+CTRL,Up,viewtoleft,0
bind=SUPER+CTRL,Down,viewtoright,0

# Move window to adjacent workspace
bind=SUPER+CTRL+ALT,Up,tagtoleft,0
bind=SUPER+CTRL+ALT,Down,tagtoright,0

# Mouse wheel workspace navigation
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER+CTRL,UP,tagtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright

# ============================================
# Workspaces (1-9) - Numbered tags
# ============================================
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# ============================================
# Monitor Navigation
# ============================================
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right

bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right

# ============================================
# Window States & Actions
# ============================================
# Window Resizing
bind=SUPER,equal,resizewin,5,0
bind=SUPER,minus,resizewin,-5,0
bind=SUPER+CTRL,equal,resizewin,0,5
bind=SUPER+CTRL,minus,resizewin,0,-5

bind=SUPER,W,togglefloating

# Toggle overview
bind=SUPER,Tab,toggleoverview,
bind=ALT,Tab,focusstack,next


# Fullscreen and maximize
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=ALT,a,togglemaximizescreen,

# Minimize/restore
bind=SUPER,I,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER+SHIFT,o,toggleoverlay,
bind=SUPER+SHIFT,g,toggleglobal,

# Scratchpad
bind=SUPER,S,toggle_scratchpad

# ============================================
# Screenshot
# ============================================
bind=SUPER,P,spawn,noctalia msg screenshot-region [widget-name]

# ============================================
# Gaps & Layout
# ============================================
bind=CTRL+SHIFT,space,switch_layout
bind=CTRL,space,spawn,python3 $HOME/.config/mango/bin/layout-picker.py
bind=CTRL,d,setlayout,DW

# Scroller layout controls
bind=SUPER+ALT,f,set_proportion,1.0
bind=ALT,space,switch_proportion_preset,
bind=SUPER+SHIFT,c,scroller_stack,right
bind=SUPER,c,scroller_stack,left

# Gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps
bind=SUPER+SHIFT,A,spawn,$HOME/.config/mango/bin/toggle-outer-gaps.sh

# ============================================
# Mouse Button Bindings
# ============================================
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ============================================
# Axis Bindings (Mouse wheel)
# ============================================
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ============================================
# Touchpad Gesture Bindings
# ============================================
gesturebind=none,up,4,viewtoright,0
gesturebind=none,down,4,viewtoleft,0

gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down

bind=SUPER,A,spawn,noctalia msg panel-toggle launcher
bind=SUPER,comma,spawn,noctalia msg settings-toggle

bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute


bind=SUPER+SHIFT,Z,spawn,noctalia msg media toggle
bind=SUPER+SHIFT,X,spawn,noctalia msg media previous
bind=SUPER+SHIFT,C,spawn,noctalia msg media next



bind=SUPER,ESCAPE,spawn,noctalia msg panel-toggle session
bind=SUPER,V,spawn,noctalia msg panel-toggle clipboard
bind=SUPER+SHIFT,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,l,spawn,noctalia msg session lock



