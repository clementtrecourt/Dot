# ~/.tmux.conf

# ---------------------------------------------------------
# 1. PARAMÈTRES DE BASE
# ---------------------------------------------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Couleurs correctes pour Starship et Neovim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ---------------------------------------------------------
# 2. GESTION DES FENÊTRES ET SPLITS (Sans préfixe)
# ---------------------------------------------------------
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-pane
bind -n M-/ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# ---------------------------------------------------------
# 3. NAVIGATION ENTRE LES SPLITS (Alt + Flèches)
# ---------------------------------------------------------
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ---------------------------------------------------------
# 4. REDIMENSIONNER LES SPLITS (Ctrl + Flèches)
# ---------------------------------------------------------
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D

# ---------------------------------------------------------
# 5. ESTHÉTIQUE DE LA BARRE D'ÉTAT (Minimaliste & Top)
# ---------------------------------------------------------
# Placer la barre en haut (comme un navigateur web)
set -g status-position bottom

# Rendre le fond de la barre transparent
set -g status-style bg=default,fg=white

# Nettoyer la droite (cacher l'heure et le nom du PC)
set -g status-right ""

# Afficher le nom de la session (ex: "main") à gauche en couleur cyan
set -g status-left "#[fg=cyan,bold] #S #[default]  "
set -g status-left-length 20

# Design des onglets INACTIFS (Texte gris, fond transparent)
setw -g window-status-format "#[fg=gray] #I:#W "

# Design de l'onglet ACTIF (Texte noir, fond cyan)
setw -g window-status-current-format "#[bg=cyan,fg=black,bold] #I:#W "
