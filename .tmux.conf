# ~/.tmux.conf

# ---------------------------------------------------------
# 1. PARAMÈTRES DE BASE
# ---------------------------------------------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Pas de délai ESC (crucial pour Neovim)
set -sg escape-time 0
# Transmet les événements focus à Neovim
set -g focus-events on
# Historique scrollback
set -g history-limit 50000

# Couleurs correctes pour Starship et Neovim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ---------------------------------------------------------
# 2. GESTION DES FENÊTRES ET SPLITS (Sans préfixe)
# ---------------------------------------------------------
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-pane
bind -n M-/ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# ---------------------------------------------------------
# 3. NAVIGATION ENTRE LES SPLITS (Alt + Flèches)
# ---------------------------------------------------------
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ---------------------------------------------------------
# 4. REDIMENSIONNER LES SPLITS (Ctrl + Flèches)
# ---------------------------------------------------------
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D
bind-key -n M-e resize-pane -Z

# ---------------------------------------------------------
# 5. ESTHÉTIQUE DE LA BARRE D'ÉTAT (Minimaliste & Top)
# ---------------------------------------------------------
# Placer la barre en haut (comme un navigateur web)
set -g status-position bottom

# Rendre le fond de la barre transparent
set -g status-style bg=default,fg=white

# Nettoyer la droite (cacher l'heure et le nom du PC)
set -g status-right ""

# Afficher le nom de la session (ex: "main") à gauche en couleur cyan
set -g status-left "#[fg=cyan,bold] #S #[default]  "
set -g status-left-length 20

# Design des onglets INACTIFS (Texte gris, fond transparent)
setw -g window-status-format "#[fg=gray] #I:#W "

# Design de l'onglet ACTIF (Texte noir, fond cyan)
setw -g window-status-current-format "#[bg=cyan,fg=black,bold] #I:#W "


# ---------------------------------------------------------
# 6. ALLER DIRECTEMENT À UN TAB (Alt + 1, Alt + 2...)
# ---------------------------------------------------------
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


# Use vi-style keys in copy mode
set -g mode-keys vi

# Alt-v enters copy mode
bind-key -n M-v copy-mode

# v = start visual selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# V = visual line selection
bind-key -T copy-mode-vi V send-keys -X select-line

# y = yank/copy
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
